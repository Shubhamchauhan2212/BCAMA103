<!DOCTYPE html>
<head>
    <title>table with some css</title>
    <style>
        .table{
            border: 2px solid black ;
            border-collapse: collapse;
        }
        td{
            border: 2px solid black;
            border-collapse: collapse;
            width: 150px;
            background: rgb(180, 161, 161);
        }
        thead{
            border: 2px solid black;
        }
        th{
            border: 2px solid black;
            background: #a5c197;
        }
    </style>
    <body>
    <table class="table">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
            </tr>
            <tbody>
                <tr>
                    <td>Shubham</td>
                    <td>Chauhan</td>
                    <td>18</td>
                </tr>
                <tr>
                    <td>Dhruv </td>
                    <td>Darji</td>
                    <td>16</td>
                </tr>
                <tr>
                    <td>Jainam</td>
                    <td>Jain</td>
                    <td>19</td>
                </tr>
            </tbody>
        </thead>
    </table>
    </body>
</head>
