<!DOCTYPE html>
<html>
<head>
    <title>Div and Span Example</title>
    <style>
        .sameColor {
            color: blue; /* Same color applied */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div>
        This is a <span class="sameColor">Word1</span> inside a div.
    </div>
    <div>
        This is another <span class="sameColor">Word2</span> inside a div.
    </div>
</body>
</html>
