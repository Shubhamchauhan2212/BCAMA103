<!DOCTYPE html>
<head>
    <title>order list </title>
    <style>
        h1{
            color: wheat;
            font-style: italic;
        }
        body{
            background-color: black;
        }
        ol1{
            color: brown;
            list-style-type: lower-roman;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        ol2{
            color: aqua;
            list-style: number;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
    <body>  
        <h1> My favorite subject </h1>
      <ol1>
        <li class="li1">English</li>
        <li class="li2">Gujrati</li>
        <li class="li3">Maths</li>
        <li class="li4">Science</li>
        <li class="li5">Economics</li>
      </ol1>  
      <h1>My favorite games  </h1>
      <ol2>
        <li class="game1">Kho kho </li>
        <li class="game2">Foot ball</li>
        <li class="game3">Cricket</li>
        <li class="game4">Hockey</li>
        <li class="game5">Chess</li>
      </ol2>
    </body>
</head>
