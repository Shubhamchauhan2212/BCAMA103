<!DOCTYPE html>

<head>
    <title>Un order list</title>
    <style>
        body {
            background-color: rgb(27, 230, 30);
        }

        h1 {

            color: blueviolet;
        }

        .in1 {
            color: red;
             list-style: circle;

        }

        .in2 {
            color: rgb(241, 241, 116);
            list-style: square;
        }

        .in3 {
            color: red;
            list-style-type: upper-roman;
            
        }   

        .in4 {
            color: rgb(136, 238, 136);
            list-style: none;
        }

        .in5 {
            color: rgb(216, 129, 7);
           list-style-type: square;
        }
    </style>

<body>
    <h1>My favorite food</h1>
    <ul>
        <li class="in1"> Apple </li>
        <li class="in2"> Banana </li>
        <li class="in3"> Stawbary </li>
        <li class="in4"> Graps </li>
        <li class="in5"> Orange</li>
    </ul>
</body>
</head>
