<!DOCTYPE html>
<html>

<head>
  <title>Background Example</title>
  <style>
    body {
      background-color: lightblue;
      /* Background color */
      background-image: url("https://cdn.pixabay.com/photo/2025/07/22/22/21/iceberg-9729316_1280.jpg");
      /* Background image */
      background-repeat: no-repeat;
      /* Prevent repeating */
      background-size: cover;
      /* Cover full screen */
    }
  </style>
</head>

<body>
  <h1>Welcome to My Webpage</h1>
  <p>This webpage has a background color and image.</p>
</body>

</html>
