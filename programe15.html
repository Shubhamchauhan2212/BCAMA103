<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Red Text on Colored Background</title>
  <style>
    body{
      margin:0;
      padding:0;
      background-color: #f0f4ff; /* any background color */
      color: red;                /* make all text red */
      font-family: Arial, sans-serif;
    }
    .wrap{
      min-height:100vh;
      display:grid;
      place-items:center;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>This text is red</h1>
    <p>And the page has a background color.</p>
  </div>
</body>
</html>
