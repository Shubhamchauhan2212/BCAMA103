<!DOCTYPE html>
<html>
<head>
    <title>Personal Details Form</title>
    <style>
        body{
            background: #f2f2f2;
        }
        .container{
            width: 400px;
            margin: auto;
           padding: 20px;
           background: white;
           align-items: center;
           border-radius: 20px;
           height: 500px    ;
        }
        label{
            display: block;
        }
        h2{
            text-align: center  ;
        }
        input{
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Personal Details Form</h2>
    <form>
        <label>Full Name:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Phone Number:</label>
        <input type="tel" name="phone" required>

        <label>Gender:</label>
        <select name="gender">
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Address:</label>
        <textarea name="address"></textarea>

        <input type="submit" value="Submit">
    </form>
</div>

</body>
</html>
